# Example instance spec of Keel WordPress, the replica of a replicated pair in
# a cloud simple installation (keel docs/spec.md and docs/replication.md;
# handbook decisions 0047, 0049 and 0059). The primary is
# keel/instance.pair.example.yaml. Boot this node after the primary is in the
# mesh, because the address of the primary is known only then. It needs no
# secrets.app_password: the site and its administrator come with the copy of
# the primary. It has the same secrets.db_password as the primary. Then: keel
# mesh invite on a member, keel mesh join here, keel vip pair. Overlays are
# every overlay of the chain: Core's five and Web's three.
version: 1

instance:
  hostname: wordpress-b
  fqdn: wordpress-b.example.org

network:
  managed_by: host
  interfaces:
    eth0:
      ipv6:
        method: auto
  # the mesh: this node's side of the WireGuard overlay; keel mesh join
  # writes it, with the other member of the pair as a peer
  overlay:
    wireguard:
      interface: wg0
      address: fd2a:9c41:7e03::2/64
      listen_port: 51820
      peers:
        - public_key: 0niNkgzhpbKmTSrWCzukb6jaYogKZkGhW+xWlh52Mh8=
          endpoint: "[2001:db8:2::10]:51820"
          allowed_ips: [fd2a:9c41:7e03::1/128]
          persistent_keepalive: 25

tls:
  acme:
    enabled: false

appliance:
  name: wordpress
  # the pair's VIP: one /128 of the overlay's VIP range, the same on both
  # nodes (keel docs/vip.md)
  vip: fd2a:9c41:7e03::ffff:1
installation:
  mode: cloud_simple
overlays:
  installer: enabled
  wireguard: enabled
  etcd: disabled
  crowdsec: enabled
  vip: enabled
  nginx: enabled
  coraza: enabled
  anubis: enabled

database:
  server:
    engine: mariadb
    # the role chosen at installation; after the first claim the VIP's
    # holder is the primary (0049)
    role: replica
    # where this node replicates from before it has a pair record: the overlay
    # address of the primary, never the VIP. Without it and without a record,
    # keel spec validate refuses this spec (keel#267). keel derives the primary
    # when the pair record exists, so this can stay or go after keel vip pair.
    replication:
      primary:
        host: fd2a:9c41:7e03::1
    # keel binds what is declared here plus the VIP (keel docs/replication.md)
    listen:
      - "fd2a:9c41:7e03::2"
      - "::1"
      - 127.0.0.1

secrets:
  root_password:
    file: /etc/keel/secrets/root_password
  db_password:
    file: /etc/keel/secrets/db_password

app:
  email: admin@example.org
  domain: wordpress.example.org
  options:
    admin_user: admin
    site_title: WordPress
    db_user: wordpress
    db_name: wordpress
    db_prefix: wp_

hub:
  api_key: skip

security:
  alerts: skip
  updates_at_first_boot: skip

first_login_wizard: false
