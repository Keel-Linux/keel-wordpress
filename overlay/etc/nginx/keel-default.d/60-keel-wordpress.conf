# keel-wordpress: the WordPress site on nginx (handbook decision 0059).
#
# keel-web 0.3.0 includes this directory in its default site, on 80 and 443,
# and in the server behind Anubis (unix:/run/nginx/keel-app.sock), so the
# site answers in the simple mode and behind Anubis in the cloud modes. That
# default site is a conffile of keel-web and has a "location /" and a root
# of its own, and a second "location /" is an error. So the site is made of
# regular expressions. nginx takes the longest prefix first and then tries
# the regular expressions in the order they stand, and the first one that
# matches wins, unless the prefix is ^~. Thus:
#
#   - /keel-check/ is a ^~ prefix in 50-keel-lnmp.conf, and no expression
#     below takes it;
#   - /keel-health and the two error pages are exact locations of the
#     default site, and an exact location wins over every expression;
#   - the refusals come first, then the PHP handler, then the catch-all.
#
# Each location that serves files names its root, because the root of the
# default site is the placeholder page of keel-web.
#
# What it refuses (the hardening of a WordPress site):
#   - wp-config.php and its sample;
#   - PHP in the directories the web user writes. An upload that is a PHP
#     file never runs;
#   - the PHP files of wp-includes and wp-admin/includes, which WordPress
#     loads itself and are never a URL;
#   - hidden files and directories, but not /.well-known/;
#   - log, backup and dump files.
#
# xmlrpc.php is reachable, as it was under Apache, where nothing refused
# it: the mobile apps and Jetpack use it. To refuse it, add
# "location = /xmlrpc.php { deny all; }" before the PHP handler.
#
# Pretty permalinks are try_files with a fallback to index.php, so no
# .htaccess is read. The limits follow the Makefile: PHP_POST_MAX_SIZE and
# PHP_UPLOAD_MAX_FILESIZE are 64M, PHP_MAX_EXECUTION_TIME is 120.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location ~* ^/wp-config(?:-sample)?\.php$ {
	deny all;
}

location ~* ^/wp-content/(?:uploads|cache|upgrade|upgrade-temp-backup)/.*\.(?:php|phtml|phar)$ {
	deny all;
}

location ~* ^/wp-(?:includes|admin/includes)/[^/]*\.php$ {
	deny all;
}

location ~ /\.(?!well-known/) {
	deny all;
}

location ~* \.(?:log|bak|orig|swp|sql)$ {
	deny all;
}

location ~ \.php$ {
	root /var/www/wordpress;
	include snippets/fastcgi-php.conf;
	fastcgi_pass unix:/run/php/php-fpm.sock;
	fastcgi_read_timeout 120s;
	client_max_body_size 64m;
}

location ~ ^/ {
	root /var/www/wordpress;
	index index.php;
	client_max_body_size 64m;
	try_files $uri $uri/ /index.php?$args;
}
