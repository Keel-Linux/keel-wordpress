# keel-wordpress: the root of the static files of the Anubis front.
#
# Behind Anubis (the cloud modes), the front of Keel Web serves a static
# file (CSS, JavaScript, an image or a font) without the challenge, but
# only when it is a file on the disk under this root. Every other path,
# every .php path too, goes through Anubis as before. Thus the styles and
# scripts of the login and admin pages, which WordPress links as files
# (CONCATENATE_SCRIPTS false in wp-config.php), and the files of the theme
# and of the uploads come without the challenge.
#
# It needs keel-web 0.4.2, which includes /etc/nginx/keel-static.d/*.conf
# in the static location of its front.
root /var/www/wordpress;
