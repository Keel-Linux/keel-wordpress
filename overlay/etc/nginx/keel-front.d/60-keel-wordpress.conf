# keel-wordpress: the body limit of the front site (Keel-Linux/keel-web#15).
#
# Behind Anubis (the cloud modes) the front site of Keel Web receives a
# request first and hands it to Anubis, and its own limit is 1 MB. A media
# upload is larger, so it answered 413 before it reached the route of
# 60-keel-wordpress.conf in keel-default.d. This file sets the limit that
# the route and PHP have: 64 MB, as PHP_UPLOAD_MAX_FILESIZE and
# PHP_POST_MAX_SIZE in the Makefile.
#
# It needs keel-web 0.3.2, which includes /etc/nginx/keel-front.d/*.conf in
# its front server, after its own limit, and keel-overlay-coraza 0.1.4.
# That rule set reads no file of an upload as an argument, and it refuses a
# form, JSON or XML body of more than 256 KiB. Measured on a container of
# 2 GB: an upload of 32 MiB costs a worker about 10 MiB. Without
# keel-overlay-coraza 0.1.4, a body of 3 MB stopped the container.
client_max_body_size 64m;
