# keel-wordpress: the REST API of WordPress behind Coraza (handbook decision
# 0030, overlay coraza). The block editor saves a post with a JSON body, for
# example {"content":"<!-- wp:paragraph --><p>text</p><!-- /wp:paragraph -->"}.
#
# The Coraza overlay does not select the JSON body processor, so Coraza reads
# such a body as an urlencoded one: the whole JSON text is the name of one
# argument, and every "&" in it starts another. The Core Rule Set then reads
# the HTML comments of the blocks as an attack (rule 941180, "<!--" in
# ARGS_NAMES, critical), and the editor cannot save. Measured on 2026-10-18
# with Coraza 0.21.0 and the Core Rule Set 4.25.1.
#
# So for a write with a JSON content type to /wp-json/, and only then, no
# Core Rule Set rule reads the arguments or their names. These carry nothing
# but that one text, which WordPress itself checks: the REST API refuses a
# request without a logged in user and a valid nonce. Every other target
# still has its rules (the headers, the path, the cookies), and so has every
# other request. The query string of such a request is not read either, and
# that is the price.
#
# When the overlay selects the JSON body processor, this file must go: the
# arguments are then json.title, json.content and so on, and the rules should
# read them with an exclusion for the content fields only.
#
# Loaded by /usr/share/coreruleset/coreruleset.load before the rules. The id
# is in Keel's range for local rules (10000 to 10199).
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" \
    "id:10101,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@beginsWith /wp-json/" \
        "chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
            "t:none,t:lowercase,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_NAMES"
