# keel-wordpress: the REST API of WordPress behind Coraza (handbook decision
# 0030, overlay coraza). The block editor saves a post with a JSON body, for
# example {"content":"<!-- wp:paragraph --><p>text</p><!-- /wp:paragraph -->"}.
#
# keel-overlay-coraza 0.1.4 selects the JSON body processor for such a body
# (Keel-Linux/common#59), so the fields of the post are the arguments
# json.title, json.content and json.excerpt. The Core Rule Set still reads
# the HTML of the blocks in them as an attack: rule 941180 ("<!--"), 941160
# (a tag of a block), 942190 and others. Measured on 2026-10-18 with Coraza
# 0.21.0 and the Core Rule Set 4.25.1. The text of a code block adds more
# (rule 932235).
#
# So for a write with a JSON content type to /wp-json/, and only then, no
# Core Rule Set rule reads these three fields, and a field named raw in
# them. WordPress itself checks that text: the REST API refuses a request
# without a logged in user and a valid nonce. Every other argument of the
# request, every argument name, the headers, the path and the cookies keep
# all their rules. The query string is read as well. A test showed that a
# SQL injection text in another field of the same body still answers 403.
#
# Loaded by /usr/share/coreruleset/coreruleset.load before the rules. The id
# is in Keel's range for local rules (10000 to 10199).
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" \
    "id:10101,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@beginsWith /wp-json/" \
        "chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
            "t:none,t:lowercase,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/^json\.(?:content|title|excerpt)(?:\.raw)?$/"

# The overlay refuses a form, JSON or XML body of more than 256 KiB with 413
# (keel-overlay-coraza 0.1.4, rule 10012; Keel-Linux/common#61). A block
# editor save of a long post is larger: with the blocks, 200 KB of text
# passes and 400 KB did not. So for the same writes this rule sets the limit
# again, to 1 MiB, after the rule of the overlay in the same phase. The
# front site takes 64 MB, as PHP does, and a bigger body is refused with 413
# here. The rules of the Core Rule Set read the fields that this file does
# not exclude, and they need about 10 s of CPU for each MiB: the limit stays
# at 1 MiB.
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" \
    "id:10102,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@beginsWith /wp-json/" \
        "chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
            "t:none,t:lowercase,ctl:requestBodyLimit=1048576"

# The login form of WordPress carries redirect_to, the page to open after
# the login, as a full URL: https://<host>/wp-admin/. Opened by IP, as an
# operator does before the name points to the machine (decision 0079),
# that URL names an IP, and the Core Rule Set scored 10 and refused the
# login with 403: by IPv4 rule 931100 ("Possible Remote File Inclusion
# (RFI) Attack: URL Parameter using IP Address"), by IPv6 also rule 932130
# ("Remote Command Execution: Unix Shell Expression Found", which reads the
# brackets of https://[2001:db8::1]/ as a shell glob). Measured on BR1 and
# BR2, 2026-11-06, with the Core Rule Set 4.25.1: no login by IP passed.
#
# So on /wp-login.php only, those two rules do not read redirect_to when
# all of this holds, and only then (the same frame as rule 10002 of
# keel-overlay-coraza for the redir of Anubis):
#
#   - the path is compared whole, after its dot segments are resolved;
#   - there is exactly one redirect_to, query and body together (hence
#     phase 2): a second one would ride on the exclusion of the first;
#   - redirect_to is an http or https URL whose host is the request's own
#     Host, port included, followed by "/".
#
# Every other rule still reads redirect_to, and every other argument keeps
# both rules. WordPress itself sends the browser only to its own host
# (wp_safe_redirect).
# 10103 for https, 10104 for http (port 80 serves the site while the
# certificate is self-signed, decision 0079).
SecRule REQUEST_FILENAME "@streq /wp-login.php" \
    "id:10103,phase:2,pass,nolog,t:none,t:normalisePath,chain"
    SecRule &ARGS:redirect_to "@eq 1" \
        "chain"
        SecRule REQUEST_HEADERS:Host "@rx ^(?:[a-z0-9.-]+|\[[0-9a-f:.]+\])(?::[0-9]{1,5})?$" \
            "t:none,t:lowercase,capture,chain"
            SecRule ARGS:redirect_to "@beginsWith https://%{tx.0}/" \
                "t:none,t:lowercase,ctl:ruleRemoveTargetById=931100;ARGS:redirect_to,ctl:ruleRemoveTargetById=932130;ARGS:redirect_to"

SecRule REQUEST_FILENAME "@streq /wp-login.php" \
    "id:10104,phase:2,pass,nolog,t:none,t:normalisePath,chain"
    SecRule &ARGS:redirect_to "@eq 1" \
        "chain"
        SecRule REQUEST_HEADERS:Host "@rx ^(?:[a-z0-9.-]+|\[[0-9a-f:.]+\])(?::[0-9]{1,5})?$" \
            "t:none,t:lowercase,capture,chain"
            SecRule ARGS:redirect_to "@beginsWith http://%{tx.0}/" \
                "t:none,t:lowercase,ctl:ruleRemoveTargetById=931100;ARGS:redirect_to,ctl:ruleRemoveTargetById=932130;ARGS:redirect_to"
