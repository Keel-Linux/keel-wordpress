# keel-wordpress: the REST API of WordPress behind Coraza (handbook decision
# 0030, overlay coraza). The block editor saves a post with a JSON body, for
# example {"content":"<!-- wp:paragraph --><p>text</p><!-- /wp:paragraph -->"}.
#
# keel-overlay-coraza 0.1.4 selects the JSON body processor for such a body
# (Keel-Linux/common#59), so the fields of the post are the arguments
# json.title, json.content and json.excerpt. The Core Rule Set still reads
# the HTML of the blocks in them as an attack: rule 941180 ("<!--"), 941160
# (a tag of a block), 942190 and others. Measured on 2026-10-18 with Coraza
# 0.21.0 and the Core Rule Set 4.25.1. The text of a code block adds more
# (rule 932235).
#
# So for a write with a JSON content type to /wp-json/, and only then, no
# Core Rule Set rule reads these three fields, and a field named raw in
# them. WordPress itself checks that text: the REST API refuses a request
# without a logged in user and a valid nonce. Every other argument of the
# request, every argument name, the headers, the path and the cookies keep
# all their rules. The query string is read as well. A test showed that a
# SQL injection text in another field of the same body still answers 403.
#
# Loaded by /usr/share/coreruleset/coreruleset.load before the rules. The id
# is in Keel's range for local rules (10000 to 10199).
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" \
    "id:10101,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@beginsWith /wp-json/" \
        "chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
            "t:none,t:lowercase,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:/^json\.(?:content|title|excerpt)(?:\.raw)?$/"
