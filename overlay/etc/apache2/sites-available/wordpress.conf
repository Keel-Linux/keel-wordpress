# The WordPress site, on both ports and on both address families.
#
# Apache's Listen directives come from ports.conf; this file only says what
# answers. The appliance's address is not known when the layer is built, so
# neither virtual host names one: wp-config.php derives WP_HOME and
# WP_SITEURL from the Host header of the request (firstboot.d/40wordpress),
# which is what keeps an appliance reached by an IPv6 literal from being
# redirected to a name that does not resolve.
ServerName localhost

<VirtualHost *:80>
    UseCanonicalName Off
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/wordpress
    ErrorLog ${APACHE_LOG_DIR}/wordpress-error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress-access.log combined
</VirtualHost>

<VirtualHost *:443>
    UseCanonicalName Off
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/wordpress
    ErrorLog ${APACHE_LOG_DIR}/wordpress-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress-ssl-access.log combined

    # The appliance terminates TLS itself with the certificate
    # firstboot.d/15regen-sslcert makes on the first boot; no layer carries
    # one, so this file names a path that exists only on a booted machine. One
    # file holds the key and the certificate, which is why both directives
    # name it.
    SSLEngine on
    SSLCertificateFile /etc/ssl/private/cert.pem
    SSLCertificateKeyFile /etc/ssl/private/cert.pem
</VirtualHost>

<Directory /var/www/wordpress>
    Options +FollowSymLinks -Indexes
    AllowOverride All
    Require all granted
</Directory>

# wp-config.php holds the database password. It is inside DocumentRoot
# because WordPress puts it there, so it is refused to the network as well as
# kept off the web user's write path.
<Files wp-config.php>
    Require all denied
</Files>
